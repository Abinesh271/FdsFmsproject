{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .login-logo {
            width: 65px;
            height: 65px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-logo">
        F
    </div>

    <h2 class="login-title">FMS Login</h2>

    <p class="login-subtitle">
        Faculty Management System
    </p>

    {% if form.errors %}
        <div class="error-message">
            Invalid username or password.
            Please try again.
        </div>
    {% endif %}

    {% if next %}
        {% if user.is_authenticated %}
            <div class="alert alert-warning">
                Your account does not have permission to access this page.
            </div>
        {% endif %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">
            <label for="id_username" class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                class="form-control"
                placeholder="Enter username"
                required
                autofocus
            >
        </div>

        <div class="mb-3">
            <label for="id_password" class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                class="form-control"
                placeholder="Enter password"
                required
            >
        </div>

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit" class="btn btn-primary btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
